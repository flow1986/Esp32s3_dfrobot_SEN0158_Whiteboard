<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>IR Whiteboard Flasher</title>
  <style>
    :root { color-scheme: light; --paper: #f2f1eb; --ink: #202a2c; --green: #176b58; --line: #d8ddda; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); font-family: "Trebuchet MS", "Segoe UI", sans-serif; display: grid; place-items: center; padding: 24px; }
    main { width: min(560px, 100%); padding: clamp(24px, 6vw, 48px); background: #fffefa; border: 1px solid var(--line); border-radius: 7px; }
    h1 { margin: 0; font: 500 34px/1.05 Georgia, serif; }
    p { color: #687477; line-height: 1.55; }
    esp-web-install-button { display: block; margin: 26px 0 18px; }
    .note { border-top: 1px solid var(--line); padding-top: 16px; font-size: 13px; }
    a { color: var(--green); }
  </style>
  <script type="module" src="https://unpkg.com/esp-web-tools@10.0.1/dist/web/install-button.js?module"></script>
</head>
<body>
  <main>
    <h1>IR Whiteboard</h1>
    <p>Firmware für ESP32-S3 mit SEN0158. Das Gerät muss per USB direkt am Computer angeschlossen sein.</p>
    <esp-web-install-button manifest="manifest.json"></esp-web-install-button>
    <p class="note">Benötigt Chrome oder Edge mit Web Serial. Im Browser die serielle Schnittstelle des ESP32-S3 auswählen. Beim Flashen werden vorhandene Einstellungen gelöscht.</p>
  </main>
</body>
</html>
